# Example LibreChat configuration that points LibreChat at this project's n8n webhook.
#
# The n8n workflow exposes an OpenAI `chat/completions`-shaped endpoint, so LibreChat can talk
# to it as a "custom endpoint" with no adapter in between.
#
# How to use this file:
#   1. Copy it into your LibreChat project root, next to LibreChat's own `.env`, and rename it
#      to `librechat.yaml` (or keep the name and point `CONFIG_PATH` at it).
#   2. Mount it into the LibreChat API container. In LibreChat's
#      `docker-compose.override.yml`:
#
#        services:
#          api:
#            volumes:
#              - type: bind
#                source: ./librechat.yaml
#                target: /app/librechat.yaml
#
#   3. Set `baseURL` below to the value that matches your deployment (see the notes on it).
#   4. Restart LibreChat: `docker compose down && docker compose up -d`. Editing the file alone
#      is not enough; the API container reads it at boot. LibreChat exits with code 1 on a
#      validation error, so check `docker compose logs api` if it does not come back up.
#
# Schema reference: https://www.librechat.ai/docs/configuration/librechat_yaml

version: 1.3.16
cache: true

endpoints:
  custom:
    - name: "Retail Support Agent"

      # Required by the schema, but the n8n webhook has no authentication of its own: the only
      # API key in this system is the one n8n itself sends to the FastAPI microservice, and it
      # is stored in an n8n credential, never here. LibreChat refuses to start with an empty
      # `apiKey`, so put a dummy literal. Do NOT use "user_provided" here: that would prompt
      # every user for a key that nothing checks.
      #
      # If you later put the webhook behind an authenticating proxy, replace this with
      # "${SOME_ENV_VAR}" and LibreChat will substitute the environment variable at load time.
      apiKey: "n8n"

      # The full URL of the n8n production webhook. Pick the line that matches your setup and
      # delete the others.
      #
      #   (a) LibreChat runs in its OWN Compose project on the same host as this one
      #       (the common case). The two projects are on different Docker networks, so reach
      #       n8n through the host:
      #         baseURL: "http://host.docker.internal:5678/webhook/agent-chat"
      #       On Docker Desktop that name resolves out of the box. On plain Linux, add it to
      #       LibreChat's `api` service:
      #         extra_hosts:
      #           - "host.docker.internal:host-gateway"
      #       (or use the host's LAN address, or the default bridge gateway 172.17.0.1).
      #
      #   (b) LibreChat is attached to THIS project's Compose network (for example via an
      #       external network, or by adding LibreChat to this repo's docker-compose.yml).
      #       Then address the n8n service by its Compose service name:
      #         baseURL: "http://n8n:5678/webhook/agent-chat"
      #
      #   (c) LibreChat runs directly on the host, not in a container:
      #         baseURL: "http://localhost:5678/webhook/agent-chat"
      #
      # Why `localhost` is wrong in (a) and (b): inside a container, `localhost` is that
      # container's own loopback interface, not the host's. A request to
      # http://localhost:5678 from the LibreChat container never leaves the container and
      # fails with "connection refused", because nothing is listening on port 5678 inside it.
      # The published port 5678 belongs to the host, and the n8n container's port belongs to
      # the Compose network. Only (c), where LibreChat really is the host, can use localhost.
      baseURL: "http://host.docker.internal:5678/webhook/agent-chat"

      # By default LibreChat appends "/chat/completions" to `baseURL`. The n8n webhook path is
      # fixed at /webhook/agent-chat, so tell LibreChat that `baseURL` already IS the
      # completions endpoint. Without this, every request would 404 against
      # /webhook/agent-chat/chat/completions.
      directEndpoint: true

      # THIS IS THE IMPORTANT PART.
      #
      # `x-conversation-id` is the primary source of the agent's session id. The n8n workflow
      # derives its session key in three tiers: this header first, then a hash of the first
      # user message, then the execution id. Without the header, the agent falls back to
      # hashing the opening message, so two different customers who both start with "Hola"
      # land in the SAME session: they share the conversational memory buffer and the stored
      # session context (name, budget, preferences, last order consulted), and each one sees
      # fragments of the other's conversation.
      #
      # `{{LIBRECHAT_BODY_CONVERSATIONID}}` is LibreChat's documented placeholder for the
      # current conversation's id, substituted per request. One LibreChat conversation then
      # maps to exactly one agent session, and a new chat starts a genuinely new session.
      #
      # Header values must be strings. Other documented placeholders in this family are
      # {{LIBRECHAT_BODY_MESSAGEID}}, {{LIBRECHAT_BODY_PARENTMESSAGEID}} and the
      # {{LIBRECHAT_USER_*}} set; `${ENV_VAR}` works here too.
      headers:
        x-conversation-id: "{{LIBRECHAT_BODY_CONVERSATIONID}}"

      # The workflow ignores the requested model name and always answers with the model
      # configured in the n8n "DeepSeek Chat Model" node. This single entry just gives the
      # LibreChat model selector something to show, and matches the `model` field the webhook
      # echoes back. `fetch` must be false: the webhook does not implement GET /models.
      models:
        default: ["deepseek-flash"]
        fetch: false

      modelDisplayLabel: "Retail Support Agent"

      # Title generation would send an extra, out-of-band completion request to the same
      # webhook. That request would carry the same conversation id and therefore land in the
      # customer's session, polluting the memory buffer with a summarisation prompt. Leave it
      # off unless you point `titleEndpoint` at a different, plain LLM endpoint.
      titleConvo: false

      # The webhook always replies with a single, complete JSON body; it never streams SSE
      # chunks. LibreChat sends `"stream": true` by default, which the workflow ignores. If
      # your LibreChat version waits for a stream that never arrives, force it off here.
      addParams:
        stream: false

      # Sampling and penalty parameters are set on the n8n side (temperature lives in the
      # DeepSeek Chat Model node), and the webhook ignores anything else in the body. Dropping
      # them keeps the request minimal.
      dropParams: ["frequency_penalty", "presence_penalty", "user"]
