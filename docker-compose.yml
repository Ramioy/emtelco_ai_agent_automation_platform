# One file, one command. `docker compose up -d` builds the microservice and the demo console,
# starts and provisions
# n8n (owner account, both credentials, the workflow, published), and brings up LibreChat wired
# to the agent. Every image is pinned to an exact version and every piece of service state lives
# on a named volume, so there are no host directories to create or chown first.

services:

  # ============================================================================
  # This project: the business-logic microservice and the n8n workflow
  # ============================================================================

  api:
    build: ./core-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: ./app/data/db/mock.db
      TOOLS_API_KEY: ${TOOLS_API_KEY:-local-demo-tools-key}
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-local-demo-operator-key}
      # Per-user isolation. "enforced" is the shipped setting: a tool call with no
      # X-End-User-Id header cannot read or write customer data, and an end user already
      # linked to one customer is refused on every other one. See the README.
      IDENTITY_ISOLATION: ${IDENTITY_ISOLATION:-enforced}
      IDENTITY_REBINDING: ${IDENTITY_REBINDING:-denied}
    volumes:
      # Only the database file, never the directory that also holds schema.sql and the seed
      # fixtures: a volume mounted over those would shadow the image's copies, and a schema
      # change shipped in a new build would never reach a machine that already has the volume.
      - api-data:/app/app/data/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # The operations console used during a demo: shows the orders, warranties and support
  # tickets as the microservice sees them and changes their state in one click. It holds the
  # operator key, not the agent key, so it reaches the list endpoints the agent cannot and is
  # outside the per-customer isolation rule. The key stays in its own process and never
  # reaches the browser.
  demo-console:
    build: ./demo-console
    ports:
      - "8090:8090"
    environment:
      CORE_API_BASE_URL: http://api:8000
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-local-demo-operator-key}
      TZ: ${GENERIC_TIMEZONE:-America/Bogota}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    # n8n's own registry, not Docker Hub, to avoid anonymous-pull rate limits.
    image: docker.n8n.io/n8nio/n8n:2.39.8
    ports:
      - "5678:5678"
    # The wrapper imports the credentials and the workflow *before* handing over to n8n's own
    # entrypoint. n8n registers production webhooks at boot, so provisioning first is what
    # removes the "publish, then restart n8n" step.
    entrypoint: ["tini", "--", "/bin/sh", "/provisioning/n8n-entrypoint.sh"]
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Bogota}
      TZ: ${GENERIC_TIMEZONE:-America/Bogota}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-866e6fdcdccee213b9b2d43e0ed1ce8d}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      # Read by the provisioning script to build the two credentials.
      TOOLS_API_KEY: ${TOOLS_API_KEY:-local-demo-tools-key}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./provisioning:/provisioning:ro
      - ./n8n-instance/workflows:/workflows:ro
    healthcheck:
      # /healthz answers while n8n is still booting, before the REST layer and the production
      # webhooks are mounted. /rest/settings only answers once they are.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5678/rest/settings"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Creates the n8n owner account so the first-run wizard never appears. It is the one step with
  # no CLI path, so it goes through n8n's own POST /rest/owner/setup. Runs once and exits.
  n8n-init:
    image: docker.n8n.io/n8nio/n8n:2.39.8
    entrypoint: ["node", "/provisioning/setup-n8n-owner.js"]
    environment:
      N8N_URL: http://n8n:5678
      N8N_OWNER_EMAIL: ${N8N_OWNER_EMAIL:-owner@localhost.local}
      N8N_OWNER_PASSWORD: ${N8N_OWNER_PASSWORD:-Localdemo1}
      N8N_OWNER_FIRST_NAME: ${N8N_OWNER_FIRST_NAME:-Demo}
      N8N_OWNER_LAST_NAME: ${N8N_OWNER_LAST_NAME:-Owner}
    volumes:
      - ./provisioning:/provisioning:ro
    depends_on:
      n8n:
        condition: service_healthy
    restart: "no"

  # ============================================================================
  # LibreChat: the chat frontend, and the services it needs
  # ============================================================================
  # Upstream's Compose bind-mounts LibreChat's data directories and runs the containers as
  # uid 1000; on Linux Docker creates those directories as root and Meilisearch crashloops with
  # a bare "Permission denied". Named volumes inherit the image's own ownership, so that class
  # of failure cannot happen here. Upstream's ~900-line .env is replaced by the settings below.

  librechat:
    image: registry.librechat.ai/danny-avila/librechat:v0.8.7
    ports:
      - "3080:3080"
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      NODE_ENV: production
      DOMAIN_CLIENT: http://localhost:3080
      DOMAIN_SERVER: http://localhost:3080
      APP_TITLE: Retail Support Agent
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-b77ce230b534b8444c954b45c913597a}
      MEILI_NO_ANALYTICS: "true"
      SEARCH: "true"
      RAG_PORT: 8000
      RAG_API_URL: http://rag_api:8000
      # /app/data does not exist in the image, so keep the temp-credentials file on a volume
      # that does.
      LIBRECHAT_TEMP_CREDENTIALS_PATH: /app/uploads/.env.temp
      CREDS_KEY: ${CREDS_KEY:-5f27ed14d5be139a8805b68d09bbc7ed70a1afcdae6600e71be3a794bed47d3f}
      CREDS_IV: ${CREDS_IV:-149d9b9cee2f935570c9609a993d8a7b}
      JWT_SECRET: ${JWT_SECRET:-d1097c462e37e7f63fccca0470f12ab3286c53ecf2a76c028ca5b0b41acf02e7}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-5596423e9c17cb6d110d10257c7519d36b9b047ae5859e3d6c6bf0b1196d5106}
      # Anyone can create an account on this local instance; that is the intended demo flow.
      ALLOW_EMAIL_LOGIN: "true"
      ALLOW_REGISTRATION: "true"
      ALLOW_UNVERIFIED_EMAIL_LOGIN: "true"
      ALLOW_PASSWORD_RESET: "false"
      ALLOW_SOCIAL_LOGIN: "false"
      NO_INDEX: "true"
      CONSOLE_JSON: "false"
    volumes:
      # Registers the n8n webhook as an OpenAI-compatible custom endpoint.
      - ./librechat/librechat.yaml:/app/librechat.yaml:ro
      - librechat-images:/app/client/public/images
      - librechat-uploads:/app/uploads
      - librechat-logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      rag_api:
        condition: service_started
      n8n:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:8.0.20
    command: mongod --noauth
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    environment:
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-b77ce230b534b8444c954b45c913597a}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    restart: unless-stopped

  vectordb:
    image: pgvector/pgvector:0.8.0-pg15-trixie
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # Backs LibreChat's file-upload feature. The agent itself does not use it.
  rag_api:
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:v0.9.0
    environment:
      RAG_PORT: 8000
      DB_HOST: vectordb
      DB_PORT: 5432
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      # LibreChat's documented placeholder: the embeddings key is supplied per user, not here.
      OPENAI_API_KEY: user_provided
    depends_on:
      vectordb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:
  n8n-data:
  mongo-data:
  meili-data:
  pgvector-data:
  librechat-images:
  librechat-uploads:
  librechat-logs:
